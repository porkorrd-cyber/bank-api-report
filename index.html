<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายงานความคืบหน้าการเชื่อมต่อข้อมูลหมายเลขบัญชีธนาคาร</title>
<style>
:root{
 --ink:#17203a;--muted:#5b6785;--bg:#f3f6fb;--card:#ffffff;--line:#e3e9f3;
 --brand:#4f46e5;--ok:#059669;--ok-soft:#ecfdf5;--ok-line:#a7f3d0;
 --warn:#d97706;--warn-soft:#fff7ed;--warn-line:#fed7aa;--bad:#dc2626;
 --radius:14px;
 --font:'Noto Sans Thai','Sarabun','Leelawadee UI',Tahoma,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:progress}
.app{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.hero{border-radius:24px;padding:32px 28px 26px;color:#fff;background:radial-gradient(900px 300px at 85% -10%,rgba(56,189,248,.55),transparent 60%),linear-gradient(135deg,#312e81 0%,#4f46e5 50%,#0e7490 100%);box-shadow:0 18px 40px -18px rgba(49,46,129,.6)}
.eyebrow{margin:0;text-align:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hero h1{margin:6px 0 4px;text-align:center;font-size:28px;font-weight:600;line-height:1.35}
.sub{margin:0;text-align:center;opacity:.85}
.hero-row{display:flex;align-items:center;gap:28px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:170px;height:170px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.2);stroke-width:11}
.ring .bar{fill:none;stroke:#6ee7b7;stroke-width:11;stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(110,231,183,.7))}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-size:40px;font-weight:600;line-height:1}
.ring-c span{font-size:13px;opacity:.8;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:12px;flex:1 1 380px;max-width:620px}
.stat{text-align:left;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);border-radius:16px;padding:14px 16px;color:#fff;transition:transform .15s,background .15s}
.stat:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
.stat .n{display:block;font-size:34px;font-weight:600;line-height:1.1}
.stat .l{display:block;font-size:13px;opacity:.9}
.stat.on{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 10px 24px -10px rgba(0,0,0,.45)}
.stat.on.yes .n{color:var(--ok)}
.stat.on.no .n{color:var(--warn)}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:20px}
.dot{width:16px;height:16px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.28);transition:transform .15s}
.dot.ok{background:#6ee7b7;box-shadow:0 0 8px rgba(110,231,183,.8)}
.dot:hover{transform:scale(1.5)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 14px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:11px 40px 11px 42px;border:1px solid var(--line);border-radius:999px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#eef1f8;border-radius:50%;width:26px;height:26px;display:none;line-height:1}
.search.has .clr{display:block}
.sort{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.sort select{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.cols[data-f=yes],.cols[data-f=no]{grid-template-columns:1fr}
.cols[data-f=yes] .col-no,.cols[data-f=no] .col-yes{display:none}
.col h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:18px;font-weight:600}
.col h2 .pill{font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px}
.col-yes h2{color:var(--ok)}.col-yes .pill{background:var(--ok-soft);border:1px solid var(--ok-line)}
.col-no h2{color:var(--warn)}.col-no .pill{background:var(--warn-soft);border:1px solid var(--warn-line)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px 14px;align-items:center;padding:12px 14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-1px);box-shadow:0 10px 22px -14px rgba(23,32,58,.45)}
.card.yes{border-left:5px solid var(--ok);background:linear-gradient(90deg,var(--ok-soft),#fff 45%)}
.card.no{border-left:5px solid #f59e0b;background:linear-gradient(90deg,var(--warn-soft),#fff 45%)}
.card.flash{animation:pop 1.2s ease-out}
@keyframes pop{0%{box-shadow:0 0 0 0 rgba(5,150,105,.6);transform:scale(.97)}100%{box-shadow:0 0 0 16px rgba(5,150,105,0);transform:none}}
.chip{min-width:46px;text-align:center;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.yes .chip{background:var(--ok);color:#fff}
.no .chip{background:#fde7c7;color:#92400e}
.nm{font-weight:500;overflow-wrap:anywhere}
.yes .nm::before{content:'✓';color:var(--ok);font-weight:700;margin-right:8px}
.ab{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#e8ecf7;color:var(--muted);vertical-align:middle;white-space:nowrap}
.date{min-width:9em;text-align:right;color:var(--muted);white-space:nowrap}
.bk-day{display:inline-block;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.bk-mon{margin-left:.35em}
.acts{display:flex;gap:6px;align-items:center;white-space:nowrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;transition:background .15s,color .15s,border-color .15s,transform .1s}
.btn:hover{background:#eef1f8}
.btn:active{transform:scale(.96)}
.btn.x:hover{background:#fef2f2;color:var(--bad);border-color:#fca5a5}
.btn.main{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:500}
.btn.main:hover{filter:brightness(1.08);background:var(--ok)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:500}
.btn.danger:hover{background:var(--bad);filter:brightness(1.08)}
.ask{font-size:13px;color:var(--muted)}
.dinp{padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.dinp:focus{outline:2px solid var(--brand);outline-offset:1px}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;white-space:nowrap;font-size:14px;color:var(--muted)}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .tr{width:42px;height:24px;border-radius:999px;background:#cbd5e1;position:relative;transition:background .2s}
.sw .tr::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+.tr{background:var(--ok)}
.sw input:checked+.tr::after{transform:translateX(18px)}
.sw input:focus-visible+.tr{outline:2px solid var(--brand);outline-offset:2px}
.move{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#fff;border:1px dashed var(--ok-line);animation:slide .2s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:#fff}
dialog{border:0;border-radius:20px;padding:24px;width:min(360px,92vw);box-shadow:0 30px 60px -20px rgba(23,32,58,.55)}
dialog::backdrop{background:rgba(23,32,58,.45);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px;font-size:20px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:14px}
dialog input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px}
dialog input:focus{outline:2px solid var(--brand);outline-offset:1px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff;padding:8px 20px;font-weight:500}
.btn.brand:hover{background:var(--brand);filter:brightness(1.1)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
@media (max-width:820px){.cols{grid-template-columns:1fr}.hero h1{font-size:22px}.hero{padding:26px 18px 22px}}
@media (max-width:560px){
 .card{grid-template-columns:auto minmax(0,1fr)}
 .date,.acts,.sw{grid-column:1/-1}
 .date{text-align:left;min-width:0}
 .stat .n{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
<p class="eyebrow">Bank API Integration</p>
<h1>รายงานความคืบหน้าการเชื่อมต่อข้อมูลหมายเลขบัญชีธนาคาร</h1>
<p class="sub" id="sub">กำลังโหลดข้อมูล…</p>
<div class="hero-row">
<div class="ring" id="ring" role="img" aria-label="ความคืบหน้า"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"></circle><circle class="bar" id="bar" cx="60" cy="60" r="52"></circle></svg><div class="ring-c"><b id="pct">0%</b><span>เชื่อมต่อแล้ว</span></div></div>
<div class="stats" role="tablist" aria-label="กรองรายการ">
<button class="stat all on" data-f="all" type="button"><span class="n" id="n-all">0</span><span class="l">ธนาคารทั้งหมด</span></button>
<button class="stat yes" data-f="yes" type="button"><span class="n" id="n-yes">0</span><span class="l">เชื่อมต่อแล้ว</span></button>
<button class="stat no" data-f="no" type="button"><span class="n" id="n-no">0</span><span class="l">อยู่ระหว่างการเชื่อมต่อ</span></button>
</div>
</div>
<div class="dots" id="dots" aria-label="สถานะรายธนาคาร"></div>
</header>
<div class="toolbar">
<div class="search" id="search"><span class="ic">&#128269;</span><input id="q" type="search" placeholder="ค้นหาชื่อธนาคาร รหัส หรืออักษรย่อ (เช่น KTB)" aria-label="ค้นหาธนาคาร" autocomplete="off"><button class="clr" id="clr" type="button" aria-label="ล้างคำค้น">&#10005;</button></div>
<label class="sort">เรียงฝั่งเชื่อมต่อแล้ว <select id="sort"><option value="date">วันที่ล่าสุดก่อน</option><option value="code">ตามรหัสธนาคาร</option></select></label>
</div>
<main class="cols" id="cols" data-f="all">
<section class="col col-yes"><h2>เชื่อมต่อแล้ว <span class="pill" id="c-yes">0</span></h2><ul class="list" id="list-yes"></ul></section>
<section class="col col-no"><h2>อยู่ระหว่างการเชื่อมต่อ <span class="pill" id="c-no">0</span></h2><ul class="list" id="list-no"></ul></section>
</main>
</div>
<dialog id="pinDlg"><form id="pinForm" method="dialog"><h3>ใส่รหัส PIN</h3><p>ใส่รหัสเพื่อยืนยันการบันทึกข้อมูล</p><input id="pinIn" type="password" autocomplete="off" aria-label="รหัส PIN"><div class="dlg-acts"><button class="btn" type="button" id="pinNo">ยกเลิก</button><button class="btn brand" type="submit">ตกลง</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
const BANKS=[{"code": "004", "bank": "ธนาคารกสิกรไทย จำกัด (มหาชน)", "abbr": "Kbank", "status": "Live แล้ว", "target_date": "2026-10-15"}, {"code": "011", "bank": "ธนาคารทหารไทยธนชาต จำกัด (มหาชน)", "abbr": "TTB", "status": "Live แล้ว", "target_date": "2026-10-07"}, {"code": "020", "bank": "ธนาคารสแตนดาร์ดชาร์เตอร์ด (ไทย) จำกัด (มหาชน)", "abbr": "SC", "status": "Live แล้ว", "target_date": "2026-11-04"}, {"code": "022", "bank": "ธนาคารซีไอเอ็มบี ไทย จำกัด (มหาชน)", "abbr": "CIMB", "status": "Live แล้ว", "target_date": "2026-10-15"}, {"code": "025", "bank": "ธนาคารกรุงศรีอยุธยา จำกัด (มหาชน)", "abbr": "BAY", "status": "Live แล้ว", "target_date": "2026-11-11"}, {"code": "002", "bank": "ธนาคารกรุงเทพ จำกัด (มหาชน)", "abbr": "BBL", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "006", "bank": "ธนาคารกรุงไทย จำกัด (มหาชน)", "abbr": "KTB", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "014", "bank": "ธนาคารไทยพาณิชย์ จำกัด (มหาชน)", "abbr": "SCB", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "024", "bank": "ธนาคารยูโอบี จำกัด (มหาชน)", "abbr": "UOB", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "030", "bank": "ธนาคารออมสิน", "abbr": "GSB", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "033", "bank": "ธนาคารอาคารสงเคราะห์", "abbr": "GHB", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "034", "bank": "ธนาคารเพื่อการเกษตร และสหกรณ์การเกษตร", "abbr": "BAAC", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "035", "bank": "ธนาคารเพื่อการส่งออกและนำเข้าแห่งประเทศไทย", "abbr": "EXIM", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "052", "bank": "ธนาคารแห่งประเทศจีน (ไทย) จำกัด (มหาชน)", "abbr": "BOC", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "066", "bank": "ธนาคารอิสลามแห่งประเทศไทย", "abbr": "iBank", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "067", "bank": "ธนาคารทิสโก้ จำกัด (มหาชน)", "abbr": "TISCO", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "069", "bank": "ธนาคารเกียรตินาคินภัทร จำกัด (มหาชน)", "abbr": "KKPFG", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "070", "bank": "ธนาคารไอซีบีซี (ไทย) จำกัด (มหาชน)", "abbr": "ICBC", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "071", "bank": "ธนาคารไทยเครดิต จำกัด (มหาชน)", "abbr": "TCRBank", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "073", "bank": "ธนาคารแลนด์ แอนด์ เฮ้าส์ จำกัด (มหาชน)", "abbr": "LHBank", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}, {"code": "098", "bank": "ธนาคารพัฒนาวิสาหกิจขนาดกลางและขนาดย่อมแห่งประเทศไทย", "abbr": "SMEBank", "status": "อยู่ระหว่างการเชื่อมต่อ", "target_date": null}];
const YES='Live แล้ว';
const API='https://script.google.com/macros/s/AKfycbyCzfFzyQ5sms9pdH0DLfYI0_-yfDfi67KDBIF140UYcMthvJ4SBg2uk-uL1SXpyowf/exec';
let over={},ticked={},picked={},editing={},confirming={},flash={};
let filter='all',query='',sortBy='date',pin='',toastT;
try{pin=sessionStorage.getItem('bkpin')||'';}catch(e){}
const $=(s)=>document.querySelector(s);
const mk=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const isLive=(code)=>BANKS.some((b)=>b.code===code&&b.status===YES);
function dateInto(el,s){
 if(!s){el.textContent='—';return;}
 const parts=new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).formatToParts(new Date(String(s).slice(0,10)+'T00:00:00Z'));
 const get=(t)=>(parts.find((p)=>p.type===t)||{}).value||'';
 el.replaceChildren(mk('span','bk-day',get('day')),mk('span','bk-mon',get('month')),document.createTextNode(' '+get('year')));
}
function toast(msg,bad){
 const t=$('#toast');t.textContent=msg;t.className='toast show'+(bad?' bad':'');
 clearTimeout(toastT);toastT=setTimeout(()=>{t.className='toast'+(bad?' bad':'');},2800);
}
function setNum(el,v){
 const from=Number(el.dataset.v||0);el.dataset.v=String(v);
 if(from===v||typeof requestAnimationFrame!=='function'){el.textContent=String(v);return;}
 const t0=performance.now();
 const step=(t)=>{const k=Math.min(1,(t-t0)/500);el.textContent=String(Math.round(from+(v-from)*k));if(k<1)requestAnimationFrame(step);};
 requestAnimationFrame(step);
}
function split(){
 const yes=[],no=[];
 BANKS.forEach((r)=>{
  const ov=over[r.code];
  if(ov&&ov!=='none')yes.push({bank:r.bank,abbr:r.abbr,code:r.code,date:ov});
  else if(!ov&&r.status===YES)yes.push({bank:r.bank,abbr:r.abbr,code:r.code,date:r.target_date});
  else no.push(r);
 });
 return {yes,no};
}
function renderTop(s){
 const n=s.yes.length,t=BANKS.length,pct=Math.round(100*n/t);
 setNum($('#n-all'),t);setNum($('#n-yes'),n);setNum($('#n-no'),s.no.length);
 $('#pct').textContent=pct+'%';
 const C=2*Math.PI*52;$('#bar').style.strokeDasharray=(C*n/t)+' '+C;
 $('#ring').setAttribute('aria-label','เชื่อมต่อแล้ว '+n+' จาก '+t+' ธนาคาร');
 $('#sub').textContent='เชื่อมต่อแล้ว '+n+' จาก '+t+' ธนาคาร · อยู่ระหว่างการเชื่อมต่อ '+s.no.length+' แห่ง';
 $('#c-yes').textContent=String(n);$('#c-no').textContent=String(s.no.length);
 document.querySelectorAll('.stat').forEach((b)=>b.classList.toggle('on',b.dataset.f===filter));
 const okSet=new Set(s.yes.map((d)=>d.code));
 const dots=$('#dots');dots.replaceChildren();
 BANKS.slice().sort((a,b)=>a.code.localeCompare(b.code)).forEach((b)=>{
  const d=mk('button','dot'+(okSet.has(b.code)?' ok':''));d.type='button';
  d.title=b.code+' '+b.abbr+' '+b.bank+(okSet.has(b.code)?' · เชื่อมต่อแล้ว':' · อยู่ระหว่างการเชื่อมต่อ');
  d.setAttribute('aria-label',d.title);
  d.addEventListener('click',()=>{query=b.code;filter='all';$('#q').value=query;render();$('#cols').scrollIntoView({behavior:'smooth',block:'start'});});
  dots.append(d);
 });
}
function askPin(){
 return new Promise((res)=>{
  const d=$('#pinDlg'),i=$('#pinIn'),f=$('#pinForm');i.value='';let done=false;
  const fin=(v)=>{if(done)return;done=true;try{d.close();}catch(e){d.removeAttribute('open');}f.onsubmit=null;$('#pinNo').onclick=null;d.oncancel=null;res(v);};
  f.onsubmit=(e)=>{e.preventDefault();fin(i.value.trim());};
  $('#pinNo').onclick=()=>fin('');d.oncancel=()=>fin('');
  if(d.showModal)d.showModal();else d.setAttribute('open','');
  setTimeout(()=>i.focus(),30);
 });
}
function busy(on){document.querySelectorAll('button').forEach((b)=>{b.disabled=on;});document.body.style.cursor=on?'progress':'';}
async function save(code,date){
 if(!pin){pin=await askPin();if(!pin)return false;}
 busy(true);
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({pin:pin,code:code,date:date})});
  const j=await r.json();
  if(!j.ok){if(j.error==='pin'){pin='';try{sessionStorage.removeItem('bkpin');}catch(e){}toast('รหัส PIN ไม่ถูกต้อง',true);}else toast('บันทึกไม่สำเร็จ',true);busy(false);return false;}
  try{sessionStorage.setItem('bkpin',pin);}catch(e){}
  busy(false);return true;
 }catch(e){toast('บันทึกไม่สำเร็จ กรุณาลองใหม่',true);busy(false);return false;}
}
const nameEl=(d)=>{const e=mk('span','nm');e.append(document.createTextNode(d.bank));if(d.abbr)e.append(mk('span','ab',d.abbr));return e;};
const btn=(cls,text,fn,tip)=>{const b=mk('button','btn '+cls,text);b.type='button';if(tip)b.title=tip;b.addEventListener('click',fn);return b;};
function markFlash(code){flash[code]=true;setTimeout(()=>{delete flash[code];},1500);}
async function cancelBank(d){
 const v=isLive(d.code)?'none':null;
 if(!(await save(d.code,v)))return;
 if(v)over[d.code]=v;else delete over[d.code];
 delete ticked[d.bank];delete picked[d.bank];delete editing[d.code];delete confirming[d.code];
 toast('ย้าย '+d.bank+' กลับไปฝั่งอยู่ระหว่างการเชื่อมต่อแล้ว');render();
}
const match=(r)=>{const q=query.trim().toLowerCase();return !q||(r.code+' '+r.bank+' '+(r.abbr||'')).toLowerCase().includes(q);};
function renderYes(s){
 const ul=$('#list-yes');ul.replaceChildren();
 const rows=s.yes.filter(match).sort((a,b)=>sortBy==='code'?a.code.localeCompare(b.code):((b.date||'').localeCompare(a.date||'')||a.code.localeCompare(b.code)));
 rows.forEach((d)=>{
  const li=mk('li','card yes'+(flash[d.code]?' flash':''));
  li.append(mk('span','chip',d.code),nameEl(d));
  const dt=mk('span','date');const box=mk('div','acts');
  if(editing[d.code]){
   const inp=mk('input','dinp');inp.type='date';inp.min='2020-01-01';inp.max='2100-12-31';inp.value=d.date||todayStr();
   inp.setAttribute('aria-label','แก้ไขวันที่เชื่อมต่อ: '+d.bank);dt.append(inp);
   box.append(
    btn('main','✓ บันทึก',async()=>{
     if(!(inp.value&&inp.validity.valid)){inp.style.borderColor='var(--bad)';inp.focus();return;}
     if(!(await save(d.code,inp.value)))return;
     over[d.code]=inp.value;delete editing[d.code];markFlash(d.code);toast('แก้ไขวันที่ของ '+d.bank+' แล้ว');render();
    }),
    btn('','ไม่แก้',()=>{delete editing[d.code];render();})
   );
  }else if(confirming[d.code]){
   dateInto(dt,d.date);
   box.append(mk('span','ask','ย้ายกลับ?'),btn('danger','ยืนยัน',()=>{cancelBank(d);}),btn('','ไม่',()=>{delete confirming[d.code];render();}));
  }else{
   dateInto(dt,d.date);
   box.append(
    btn('','✎ แก้ไข',()=>{editing[d.code]=true;delete confirming[d.code];render();},'แก้ไขวันที่เชื่อมต่อ'),
    btn('x','✕ ยกเลิก',()=>{confirming[d.code]=true;render();},'ย้ายกลับไปฝั่งอยู่ระหว่างการเชื่อมต่อ')
   );
  }
  li.append(dt,box);ul.append(li);
 });
 if(!rows.length)ul.append(mk('li','empty',query?'ไม่พบธนาคารที่ค้นหา':'ยังไม่มีธนาคารที่เชื่อมต่อแล้ว'));
}
function renderNo(s){
 const ul=$('#list-no');ul.replaceChildren();
 const rows=s.no.filter(match).sort((a,b)=>a.code.localeCompare(b.code));
 rows.forEach((d)=>{
  const li=mk('li','card no');
  li.append(mk('span','chip',d.code),nameEl(d));
  const lab=mk('label','sw');
  const cb=mk('input');cb.type='checkbox';cb.checked=!!ticked[d.bank];
  cb.setAttribute('aria-label','ธนาคารแจ้งว่าเชื่อมต่อแล้ว: '+d.bank);
  cb.addEventListener('change',()=>{ticked[d.bank]=cb.checked;if(cb.checked&&!picked[d.bank])picked[d.bank]=todayStr();renderNo(split());});
  lab.append(cb,mk('span','tr'),mk('span',null,'ธนาคารแจ้งว่าเชื่อมต่อแล้ว'));
  li.append(lab);
  if(ticked[d.bank]){
   const box=mk('div','move');
   box.append(mk('span','ask','เชื่อมต่อเมื่อวันที่'));
   const inp=mk('input','dinp');inp.type='date';inp.min='2020-01-01';inp.max='2100-12-31';inp.value=picked[d.bank]||todayStr();
   inp.setAttribute('aria-label','วันที่เชื่อมต่อ: '+d.bank);
   inp.addEventListener('change',()=>{if(inp.value&&inp.validity.valid){picked[d.bank]=inp.value;inp.style.borderColor='';}});
   box.append(inp,btn('main','ยืนยัน ย้ายไปฝั่งเชื่อมต่อแล้ว',async()=>{
    if(!(inp.value&&inp.validity.valid)){inp.style.borderColor='var(--bad)';inp.focus();return;}
    if(!(await save(d.code,inp.value)))return;
    over[d.code]=inp.value;markFlash(d.code);toast('ย้าย '+d.bank+' ไปฝั่งเชื่อมต่อแล้ว 🎉');render();
   }));
   li.append(box);
  }
  ul.append(li);
 });
 if(!rows.length)ul.append(mk('li','empty',query?'ไม่พบธนาคารที่ค้นหา':'ทุกธนาคารเชื่อมต่อแล้ว'));
}
function render(){
 const s=split();
 $('#cols').dataset.f=filter;
 $('#search').classList.toggle('has',!!query);
 renderTop(s);renderYes(s);renderNo(s);
}
document.querySelectorAll('.stat').forEach((b)=>b.addEventListener('click',()=>{filter=b.dataset.f;render();}));
$('#q').addEventListener('input',(e)=>{query=e.target.value;render();});
$('#clr').addEventListener('click',()=>{query='';$('#q').value='';render();$('#q').focus();});
$('#sort').addEventListener('change',(e)=>{sortBy=e.target.value;render();});
async function load(){
 try{
  const r=await fetch(API);const j=await r.json();
  if(j&&j.ok){over=j.moved||{};render();}
 }catch(e){}
}
render();
load();
</script>
</body>
</html>
